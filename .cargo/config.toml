[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
runner="tools/run_qemu.sh"

# The linker script is intentionally NOT set via rustflags here, and must
# never be: cargo *joins* `rustflags` arrays across config sources (config
# files, CARGO_TARGET_<TRIPLE>_RUSTFLAGS, and `--config` alike) instead of
# replacing them. A default `-Tscripts/qemu.ld` here therefore cannot be
# overridden for the Pi4 build — the linker receives BOTH scripts and
# rust-lld produces a corrupt ELF with a mixed memory layout (program
# headers based at pi4.ld's 0x04000000 but .text at qemu.ld's 0x40401000),
# which panics on real hardware when reserving its own segments. Each entry
# point below injects exactly one linker script via `--config` instead.
#
#   cargo run-qemu                  QEMU:  -Tscripts/qemu.ld, then runs QEMU
#   tools-pi4/build_minivisor.sh    Pi4:   -Tscripts/pi4.ld, copies the ELF
#                                        into bin-pi4/disk/mini.elf
#
# Keeping rustflags out of `[build]` (above) and out of this `[target]`
# section also matters for host builds of the allocator_tests/ crate
# (x86_64-unknown-linux-gnu): a `-Tscripts/qemu.ld` argument wouldn't
# resolve relative to that crate's directory and would break `cargo test`.
[alias]
run-qemu = ["run", "--config", "target.aarch64-unknown-none-softfloat.rustflags=[\"-C\", \"link-arg=-Tscripts/qemu.ld\"]"]
